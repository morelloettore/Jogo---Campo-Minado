<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Neon Minesweeper - Campo Minado Arcade</title>
    <!-- Fontes Retro do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0c0c1e;
            --panel-bg: #141432;
            --border-color: #ff007f; /* Neon Pink */
            --border-glow: 0 0 10px #ff007f, inset 0 0 5px #ff007f;
            --neon-cyan: #00f0ff;
            --cyan-glow: 0 0 10px #00f0ff, inset 0 0 5px #00f0ff;
            --neon-green: #39ff14;
            --green-glow: 0 0 10px #39ff14;
            --neon-yellow: #ffff00;
            --yellow-glow: 0 0 10px #ffff00;
            --neon-blue: #0033ff;
            --cell-bg: #1c1c44;
            --cell-hover: #2a2a64;
            --cell-revealed: #080815;
            --retro-font: 'Press Start 2P', monospace;
            --mono-font: 'Share Tech Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--retro-font);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 50% 50%, #151030 0%, #0c0c1e 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 100%, 100% 4px, 6px 100%;
        }

        /* Efeito de Scanlines e Flicker sutil de fliperama */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.6;
        }

        .arcade-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }

        /* Título do Jogo */
        .title-container {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--neon-cyan);
            text-shadow: var(--cyan-glow);
            animation: flicker 3s infinite alternate;
            margin-bottom: 5px;
        }

        h1 span {
            color: var(--border-color);
            text-shadow: var(--border-glow);
        }

        .subtitle {
            font-size: 10px;
            color: #8a8ab0;
            letter-spacing: 1px;
            margin-top: 5px;
            font-family: var(--retro-font);
        }

        /* Painel Superior (Dificuldade e Controles) */
        .control-panel {
            background-color: var(--panel-bg);
            border: 3px solid var(--border-color);
            box-shadow: var(--border-glow);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .btn-difficulty {
            background-color: #0c0c1e;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px 14px;
            font-family: var(--retro-font);
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: inset 0 0 5px var(--neon-cyan);
            transition: all 0.2s ease;
            text-shadow: 0 0 2px var(--neon-cyan);
        }

        .btn-difficulty:hover, .btn-difficulty.active {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 15px var(--neon-cyan);
            text-shadow: none;
        }

        /* Botão Silenciar */
        .btn-sound {
            background: none;
            border: 2px solid var(--neon-yellow);
            color: var(--neon-yellow);
            padding: 10px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            font-family: var(--retro-font);
            box-shadow: inset 0 0 5px var(--neon-yellow);
            transition: all 0.2s ease;
        }

        .btn-sound:hover {
            background-color: var(--neon-yellow);
            color: #000;
            box-shadow: 0 0 15px var(--neon-yellow);
        }

        /* Gabinete de Jogo */
        .game-cabinet {
            background-color: var(--panel-bg);
            border: 4px solid var(--border-color);
            box-shadow: var(--border-glow);
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Placar (Scoreboard) */
        .scoreboard {
            background-color: #000;
            border: 3px solid var(--neon-cyan);
            box-shadow: var(--cyan-glow);
            border-radius: 8px;
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .display-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .display-label {
            font-size: 8px;
            color: var(--neon-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .display-value {
            font-family: var(--mono-font);
            font-size: 32px;
            color: var(--border-color);
            text-shadow: 0 0 10px var(--border-color);
            background-color: #050510;
            padding: 4px 12px;
            border-radius: 4px;
            border: 1px solid #331122;
            min-width: 90px;
            text-align: center;
            letter-spacing: 2px;
        }

        /* Botão reiniciar estilo fliperama */
        .btn-reset {
            background: radial-gradient(circle, #ff007f 0%, #a0004f 100%);
            border: 4px solid #fff;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px #ff007f, inset 0 2px 5px rgba(255,255,255,0.8);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .btn-reset:active {
            transform: scale(0.92);
            box-shadow: 0 0 5px #ff007f, inset 0 2px 2px rgba(0,0,0,0.6);
        }

        /* Tabuleiro */
        .board-wrapper {
            width: 100%;
            overflow-x: auto;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }

        #mines-grid {
            display: grid;
            gap: 4px;
            background-color: #050510;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid #333366;
            margin: 0 auto;
        }

        /* Célula do Campo Minado */
        .cell {
            width: 32px;
            height: 32px;
            background-color: var(--cell-bg);
            border-radius: 3px;
            border: 2px solid #3d3d7a;
            box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.15), inset 0 -2px 3px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--retro-font);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.15s, border-color 0.15s, box-shadow 0.15s;
        }

        .cell:hover:not(.revealed):not(.flagged) {
            background-color: var(--cell-hover);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-cyan), inset 0 2px 3px rgba(255, 255, 255, 0.2);
        }

        .cell.revealed {
            background-color: var(--cell-revealed);
            border: 1px solid #1c1c38;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.8);
            cursor: default;
        }

        /* Cores de número de minas neon */
        .cell[data-mines="1"] { color: #00f0ff; text-shadow: 0 0 5px rgba(0, 240, 255, 0.6); }
        .cell[data-mines="2"] { color: #39ff14; text-shadow: 0 0 5px rgba(57, 255, 20, 0.6); }
        .cell[data-mines="3"] { color: #ff073a; text-shadow: 0 0 5px rgba(255, 7, 58, 0.6); }
        .cell[data-mines="4"] { color: #b026ff; text-shadow: 0 0 5px rgba(176, 38, 255, 0.6); }
        .cell[data-mines="5"] { color: #ff355e; text-shadow: 0 0 5px rgba(255, 53, 94, 0.6); }
        .cell[data-mines="6"] { color: #1df9f5; text-shadow: 0 0 5px rgba(29, 249, 245, 0.6); }
        .cell[data-mines="7"] { color: #ffff00; text-shadow: 0 0 5px rgba(255, 255, 0, 0.6); }
        .cell[data-mines="8"] { color: #ffffff; text-shadow: 0 0 5px rgba(255, 255, 255, 0.8); }

        .cell.flagged {
            position: relative;
            background-color: var(--cell-bg);
            border-color: var(--neon-yellow);
            box-shadow: 0 0 6px var(--neon-yellow);
        }

        .cell.flagged::before {
            content: "🚩";
            font-size: 15px;
            animation: pulse 1s infinite alternate;
        }

        .cell.mine {
            background-color: #3a0011;
            border-color: #ff073a;
            box-shadow: 0 0 12px #ff073a;
            position: relative;
        }

        .cell.mine::before {
            content: "💣";
            font-size: 16px;
        }

        .cell.mine-exploded {
            background-color: #ff073a;
            border-color: #fff;
            box-shadow: 0 0 20px #ff073a, inset 0 0 10px #fff;
            animation: explode-shake 0.3s ease-out;
        }

        .cell.mine-exploded::before {
            content: "💥";
            font-size: 18px;
        }

        /* Instruções */
        .instructions {
            margin-top: 15px;
            font-size: 9px;
            color: #8a8ab0;
            text-align: center;
            line-height: 1.6;
            text-transform: uppercase;
        }

        /* Sobreposições de Feedback (YOU WIN / GAME OVER) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(6, 6, 18, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-text {
            font-size: 38px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            letter-spacing: 3px;
        }

        .overlay-win {
            color: var(--neon-green);
            text-shadow: var(--green-glow);
            animation: pulse-win 1.5s infinite;
        }

        .overlay-lose {
            color: var(--border-color);
            text-shadow: var(--border-glow);
            animation: pulse-lose 1.5s infinite;
        }

        .overlay-sub {
            font-size: 12px;
            color: #ffffff;
            margin-bottom: 25px;
            text-align: center;
            line-height: 1.8;
            font-family: var(--retro-font);
        }

        .btn-overlay {
            background-color: #0c0c1e;
            border: 3px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 15px 25px;
            font-family: var(--retro-font);
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: var(--cyan-glow);
            transition: all 0.2s ease;
        }

        .btn-overlay:hover {
            background-color: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 25px var(--neon-cyan);
        }

        /* Animações */
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
                opacity: 1;
                text-shadow: var(--cyan-glow);
            }
            20%, 24%, 55% {
                opacity: 0.7;
                text-shadow: none;
            }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes pulse-win {
            0% { transform: scale(1); text-shadow: 0 0 10px var(--neon-green); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px var(--neon-green), 0 0 10px #fff; }
            100% { transform: scale(1); text-shadow: 0 0 10px var(--neon-green); }
        }

        @keyframes pulse-lose {
            0% { transform: scale(1); text-shadow: 0 0 10px var(--border-color); }
            50% { transform: scale(1.05); text-shadow: 0 0 25px var(--border-color), 0 0 10px #fff; }
            100% { transform: scale(1); text-shadow: 0 0 10px var(--border-color); }
        }

        @keyframes explode-shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }

        /* Adaptações Responsivas */
        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            .display-value { font-size: 24px; min-width: 70px; }
            .cell { width: 26px; height: 26px; font-size: 11px; }
            .btn-difficulty { padding: 8px 10px; font-size: 9px; }
            .overlay-text { font-size: 26px; }
        }
    </style>
</head>
<body>

    <div class="arcade-container">

        <!-- Cabeçalho / Título -->
        <div class="title-container">
            <h1>Neon <span>Minesweeper</span></h1>
            <div class="subtitle">Arcade Edition v1.0</div>
        </div>

        <!-- Seletor de Dificuldade -->
        <div class="control-panel">
            <button class="btn-difficulty active" id="btn-easy" onclick="changeDifficulty('easy')">FÁCIL</button>
            <button class="btn-difficulty" id="btn-medium" onclick="changeDifficulty('medium')">MÉDIO</button>
            <button class="btn-difficulty" id="btn-hard" onclick="changeDifficulty('hard')">DIFÍCIL</button>
            <button class="btn-sound" id="btn-sound" onclick="toggleMute()">SOM: LIGADO</button>
        </div>

        <!-- Gabinete de Jogo -->
        <div class="game-cabinet">

            <!-- Tela de Vitória/Derrota -->
            <div class="overlay" id="end-overlay">
                <div class="overlay-text" id="overlay-title">YOU WIN</div>
                <div class="overlay-sub" id="overlay-stats">TEMPO: 000s<br>MINAS RESTANTES: 0</div>
                <button class="btn-overlay" onclick="resetGame()">JOGAR DE NOVO</button>
            </div>

            <!-- Placar -->
            <div class="scoreboard">
                <!-- Contador de Minas -->
                <div class="display-container">
                    <div class="display-label">Minas</div>
                    <div class="display-value" id="mine-counter">010</div>
                </div>

                <!-- Botão de Reset (Fliperama) -->
                <button class="btn-reset" id="reset-btn" onclick="resetGame()" aria-label="Reiniciar Jogo">😊</button>

                <!-- Tempo Decorrido -->
                <div class="display-container">
                    <div class="display-label">Tempo</div>
                    <div class="display-value" id="timer">000</div>
                </div>
            </div>

            <!-- Área do Tabuleiro -->
            <div class="board-wrapper">
                <div id="mines-grid"></div>
            </div>

            <!-- Legenda / Instruções -->
            <div class="instructions">
                [Clique Esquerdo: Revelar] &nbsp;&nbsp; [Clique Direito: Bandeira]
            </div>

        </div>
    </div>

    <!-- Script principal com toda a lógica e som sintetizado -->
    <script>
        // --- CONFIGURAÇÃO E CONFIGURAÇÃO DA WEB AUDIO API ---
        let audioCtx = null;
        let isMuted = false;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById('btn-sound').textContent = `SOM: ${isMuted ? 'DESLIGADO' : 'LIGADO'}`;
            // Garantir inicialização do contexto
            getAudioContext();
        }

        // --- SINTETIZADORES DE EFEITOS SONOROS 8-BIT (WEB AUDIO API) ---

        // 1. Som ao revelar célula (Chirp agudo curto)
        function playRevealSound() {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(350, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);

                osc.start();
                osc.stop(ctx.currentTime + 0.08);
            } catch (e) {
                console.error("Erro ao tocar som:", e);
            }
        }

        // 2. Som ao colocar/remover bandeira (Click metálico curto)
        function playFlagSound() {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.type = 'square';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                osc.frequency.setValueAtTime(90, ctx.currentTime + 0.03);

                gain.gain.setValueAtTime(0.06, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.05);

                osc.start();
                osc.stop(ctx.currentTime + 0.05);
            } catch (e) {
                console.error("Erro ao tocar som:", e);
            }
        }

        // 3. Som de explosão clássica de 8-bit (Ruído + Sub Baixo)
        function playExplosionSound() {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                const bufferSize = ctx.sampleRate * 0.8;
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);

                // Preenche o buffer de ruído branco
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(750, ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.75);

                const subOsc = ctx.createOscillator();
                const subGain = ctx.createGain();
                subOsc.type = 'sawtooth';
                subOsc.frequency.setValueAtTime(100, ctx.currentTime);
                subOsc.frequency.linearRampToValueAtTime(15, ctx.currentTime + 0.5);

                const mainGain = ctx.createGain();
                mainGain.gain.setValueAtTime(0.25, ctx.currentTime);
                mainGain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.8);

                subGain.gain.setValueAtTime(0.18, ctx.currentTime);
                subGain.gain.exponentialRampToValueAtTime(0.005, ctx.currentTime + 0.55);

                noise.connect(filter);
                filter.connect(mainGain);
                mainGain.connect(ctx.destination);

                subOsc.connect(subGain);
                subGain.connect(ctx.destination);

                noise.start();
                noise.stop(ctx.currentTime + 0.8);

                subOsc.start();
                subOsc.stop(ctx.currentTime + 0.55);
            } catch (e) {
                console.error("Erro ao tocar som:", e);
            }
        }

        // 4. Som de vitória majestosa (Melodia alegre arpejada de 8-bit)
        function playWinSound() {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                // Acorde brilhante de dó maior arpejado ascendendo com som quadrado retrô
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50];
                const noteDuration = 0.12;

                notes.forEach((freq, index) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'square';
                    osc.frequency.setValueAtTime(freq, ctx.currentTime + index * noteDuration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    const start = ctx.currentTime + index * noteDuration;
                    const duration = index === notes.length - 1 ? 0.6 : noteDuration * 0.9;

                    gain.gain.setValueAtTime(0.08, start);
                    gain.gain.setValueAtTime(0.08, start + duration - 0.02);
                    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);

                    osc.start(start);
                    osc.stop(start + duration);
                });
            } catch (e) {
                console.error("Erro ao tocar som:", e);
            }
        }


        // --- CONFIGURAÇÃO DA LÓGICA DO CAMPO MINADO ---
        const difficulties = {
            easy: { rows: 8, cols: 8, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 } // Padrão clássico 30x16 ou 16x30
        };

        let currentDiff = 'easy';
        let rows = difficulties.easy.rows;
        let cols = difficulties.easy.cols;
        let minesCount = difficulties.easy.mines;

        let grid = [];
        let firstClick = true;
        let gameOver = false;
        let gameWon = false;

        let timeElapsed = 0;
        let timerInterval = null;
        let flagsCount = 0;

        const gridElement = document.getElementById('mines-grid');
        const mineCounterElement = document.getElementById('mine-counter');
        const timerElement = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const endOverlay = document.getElementById('end-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayStats = document.getElementById('overlay-stats');

        // Inicializa o tabuleiro
        function initGame() {
            // Limpa o timer
            clearInterval(timerInterval);
            timerInterval = null;
            timeElapsed = 0;
            timerElement.textContent = "000";

            // Reseta estados
            firstClick = true;
            gameOver = false;
            gameWon = false;
            flagsCount = 0;
            updateMineCounter();
            resetBtn.textContent = "😊";

            // Fecha overlay
            endOverlay.classList.remove('active');

            // Reconstrói tabuleiro
            grid = [];
            gridElement.innerHTML = '';

            // Configura o grid CSS dinamicamente
            gridElement.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
            gridElement.style.gridTemplateRows = `repeat(${rows}, 32px)`;

            for (let r = 0; r < rows; r++) {
                grid[r] = [];
                for (let c = 0; c < cols; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.classList.add('cell');
                    cellEl.dataset.row = r;
                    cellEl.dataset.col = c;

                    // Eventos de clique do mouse
                    cellEl.addEventListener('click', (e) => handleCellLeftClick(r, c));
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    // Evento para simular mudança no smiley na pressão do clique esquerdo
                    cellEl.addEventListener('mousedown', (e) => {
                        if (e.button === 0 && !gameOver && !gameWon) {
                            resetBtn.textContent = "😮";
                        }
                    });

                    cellEl.addEventListener('mouseup', () => {
                        if (!gameOver && !gameWon) {
                            resetBtn.textContent = "😊";
                        }
                    });

                    gridElement.appendChild(cellEl);

                    grid[r][c] = {
                        row: r,
                        col: c,
                        isMine: false,
                        isRevealed: false,
                        isFlagged: false,
                        neighborMines: 0,
                        element: cellEl
                    };
                }
            }
        }

        // Altera a dificuldade ativa
        function changeDifficulty(diff) {
            currentDiff = diff;
            rows = difficulties[diff].rows;
            cols = difficulties[diff].cols;
            minesCount = difficulties[diff].mines;

            // Altera botão ativo
            document.querySelectorAll('.btn-difficulty').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${diff}`).classList.add('active');

            // Inicializa áudio no primeiro clique de troca de dificuldade (se necessário)
            getAudioContext();

            resetGame();
        }

        // Reseta o jogo mantendo a mesma dificuldade
        function resetGame() {
            initGame();
        }

        // Atualiza display numérico do placar com zeros à esquerda
        function formatDisplayNumber(num, size = 3) {
            let s = num + "";
            while (s.length < size) s = "0" + s;
            return s;
        }

        function updateMineCounter() {
            const displayedMines = Math.max(0, minesCount - flagsCount);
            mineCounterElement.textContent = formatDisplayNumber(displayedMines);
        }

        // Inicia o timer incremental
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timeElapsed = 0;
            timerInterval = setInterval(() => {
                timeElapsed++;
                if (timeElapsed > 999) timeElapsed = 999; // Cap nos 3 dígitos
                timerElement.textContent = formatDisplayNumber(timeElapsed);
            }, 1000);
        }

        // Geração segura de minas APÓS o primeiro clique
        function generateMines(firstRow, firstCol) {
            let minesPlaced = 0;
            while (minesPlaced < minesCount) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);

                // Evita colocar minas na vizinhança de 3x3 do primeiro clique
                const isSafeZone = Math.abs(r - firstRow) <= 1 && Math.abs(c - firstCol) <= 1;

                if (!grid[r][c].isMine && !isSafeZone) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // Calcula vizinhos
            calculateNeighborMines();
        }

        // Calcula a quantidade de minas vizinhas para cada célula
        function calculateNeighborMines() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].isMine) continue;

                    let neighbors = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = r + dr;
                            const nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                                if (grid[nr][nc].isMine) {
                                    neighbors++;
                                }
                            }
                        }
                    }
                    grid[r][c].neighborMines = neighbors;
                }
            }
        }

        // Clique esquerdo: Revela célula
        function handleCellLeftClick(r, c) {
            if (gameOver || gameWon) return;

            // Certifica de acordar a Web Audio API caso bloqueada pelo browser
            getAudioContext();

            const cell = grid[r][c];
            if (cell.isRevealed || cell.isFlagged) return;

            if (firstClick) {
                firstClick = false;
                generateMines(r, c);
                startTimer();
            }

            revealCell(r, c);
        }

        // Lógica de revelação de célula individual e flood fill
        function revealCell(r, c) {
            const cell = grid[r][c];
            cell.isRevealed = true;
            cell.element.classList.add('revealed');

            if (cell.isMine) {
                triggerGameOver(r, c);
                return;
            }

            playRevealSound();

            if (cell.neighborMines > 0) {
                cell.element.textContent = cell.neighborMines;
                cell.element.setAttribute('data-mines', cell.neighborMines);
            } else {
                // Expande adjacentes recursivamente (Flood Fill)
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            const neighbor = grid[nr][nc];
                            if (!neighbor.isRevealed && !neighbor.isFlagged) {
                                revealCell(nr, nc);
                            }
                        }
                    }
                }
            }

            checkWinCondition();
        }

        // Clique direito: coloca ou remove bandeira
        function handleCellRightClick(r, c) {
            if (gameOver || gameWon) return;

            getAudioContext();

            const cell = grid[r][c];
            if (cell.isRevealed) return;

            cell.isFlagged = !cell.isFlagged;
            if (cell.isFlagged) {
                cell.element.classList.add('flagged');
                flagsCount++;
            } else {
                cell.element.classList.remove('flagged');
                flagsCount--;
            }

            playFlagSound();
            updateMineCounter();
        }

        // Verifica se todas as células sem mina foram reveladas
        function checkWinCondition() {
            if (gameOver) return;

            let cellsToReveal = (rows * cols) - minesCount;
            let revealedCount = 0;

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (grid[r][c].isRevealed && !grid[r][c].isMine) {
                        revealedCount++;
                    }
                }
            }

            if (revealedCount === cellsToReveal) {
                triggerWin();
            }
        }

        // Trata derrota (Explosão e Game Over)
        function triggerGameOver(explodedR, explodedC) {
            gameOver = true;
            clearInterval(timerInterval);
            resetBtn.textContent = "😵";
            playExplosionSound();

            // Marca a mina que explodiu de forma dramática
            grid[explodedR][explodedC].element.classList.add('mine-exploded');

            // Revela todas as outras minas no tabuleiro
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = grid[r][c];
                    if (cell.isMine) {
                        if (!cell.isFlagged && !(r === explodedR && c === explodedC)) {
                            cell.element.classList.add('mine');
                        }
                    } else if (cell.isFlagged) {
                        // Flag colocada errada piscando ou alterada
                        cell.element.style.borderColor = "#ff073a";
                    }
                }
            }

            // Exibe Overlay de Derrota
            setTimeout(() => {
                overlayTitle.textContent = "GAME OVER";
                overlayTitle.className = "overlay-text overlay-lose";
                overlayStats.innerHTML = `TEMPO DECORRIDO: ${formatDisplayNumber(timeElapsed)}s<br>EXPLODIU EM: (${explodedR + 1}, ${explodedC + 1})`;
                endOverlay.classList.add('active');
            }, 1000);
        }

        // Trata vitória (Som de comemoração e Feedback Retro)
        function triggerWin() {
            gameWon = true;
            clearInterval(timerInterval);
            resetBtn.textContent = "😎";
            playWinSound();

            // Coloca bandeiras automaticamente em todas as minas não marcadas
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = grid[r][c];
                    if (cell.isMine && !cell.isFlagged) {
                        cell.isFlagged = true;
                        cell.element.classList.add('flagged');
                    }
                }
            }
            flagsCount = minesCount;
            updateMineCounter();

            // Exibe Overlay de Vitória
            setTimeout(() => {
                overlayTitle.textContent = "YOU WIN";
                overlayTitle.className = "overlay-text overlay-win";
                overlayStats.innerHTML = `TEMPO RECORD: ${formatDisplayNumber(timeElapsed)}s<br>DIFICULDADE: ${currentDiff.toUpperCase()}`;
                endOverlay.classList.add('active');
            }, 800);
        }

        // Inicializa o jogo ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            initGame();
        });
    </script>
</body>
</html>
